version: '3.8'

services:
  suryasetu-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suryasetu-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - DATA_DIR=dashboard_data
      - PORT=8000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-suryasetu}
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: suryasetu-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
